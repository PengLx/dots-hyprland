<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="font">
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <alias binding="strong"><family>SimSun</family>            <accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>SimHei</family>            <accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>NSimSun</family>           <accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>Microsoft YaHei</family>   <accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>Microsoft JhengHei</family><accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="strong"><family>PingFang SC</family>       <accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>PingFang TC</family>       <accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="strong"><family>宋体</family>              <accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>黑体</family>              <accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="strong"><family>微软雅黑</family>          <accept><family>Noto Sans CJK SC</family></accept></alias>
</fontconfig>
