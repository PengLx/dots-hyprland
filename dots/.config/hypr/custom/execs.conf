# hyprlang noerror false
# You can make apps auto-start here
# Relevant Hyprland wiki section: https://wiki.hyprland.org/Configuring/Keywords/#executing

# Input method
exec-once = fcitx5

# Reload Hyprland plugins (hy3) on session start
exec-once = hyprpm reload -n

# Per-workspace layout switcher (1-3 scrolling, 8 hy3, 9 master, rest dwindle)
exec-once = ~/.config/hypr/custom/scripts/layout-per-workspace.sh

# Lock immediately at session start (autologin via greetd; this is the password gate).
# Uses end4's quickshell lock so it matches the one you get on idle / Super+L.
exec-once = ~/.config/hypr/custom/scripts/lock-on-startup.sh

# Claude Code sidebar — preload on a hidden special workspace
exec-once = [workspace special:claude silent] kitty --app-id=claude-sidebar --listen-on=unix:/tmp/kitty-fairy.sock -d /home/lican -e /home/lican/.config/hypr/custom/scripts/fairy-launch.sh

