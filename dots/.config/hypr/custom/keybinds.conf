# hyprlang noerror false
# See https://wiki.hyprland.org/Configuring/Binds/
#!
##! 用户
bind = Ctrl+Super, Slash, exec, xdg-open ~/.config/illogical-impulse/config.json # 编辑 shell 配置
bind = Ctrl+Super+Alt, Slash, exec, xdg-open ~/.config/hypr/custom/keybinds.conf # 编辑用户键位

##! Claude Code
bind = Super, comma, togglespecialworkspace, claude # 切换 Claude Code 侧边栏
# Override Super+Q so it hides fairy instead of killing it
unbind = Super, Q
bind = Super, Q, exec, ~/.config/hypr/custom/scripts/smart-close.sh # 关闭(fairy 上是隐藏)
bind  = Super, grave, exec, ~/.claude/hooks/voice-input.sh start # Push-to-talk Fairy(按下)
bindr = Super, grave, exec, ~/.claude/hooks/voice-input.sh stop  # Push-to-talk Fairy(松开)

# hy3 binds are added/removed dynamically by layout-per-workspace.sh
# (only active when current workspace's layout is hy3)

