# hyprlang noerror false
# You can put custom rules here
# Window/layer rules: https://wiki.hyprland.org/Configuring/Window-Rules/
# Workspace rules: https://wiki.hyprland.org/Configuring/Workspace-Rules/

# ######## Window rules ########

# Uncomment to apply global transparency to all windows:
# windowrule = opacity 0.89 override 0.89 override, match:class .*

# Disable blur for all xwayland apps
# windowrule = no_blur on, match:xwayland 1

# ######## Claude Code sidebar (VSCode-style left panel) ########
windowrule = match:class ^(claude-sidebar)$, float on
windowrule = match:class ^(claude-sidebar)$, size (monitor_w*0.32) (monitor_h*0.92)
windowrule = match:class ^(claude-sidebar)$, move 12 50
windowrule = match:class ^(claude-sidebar)$, rounding 14

# Auto-respawn if claude exits (Ctrl+D) — next toggle re-launches it
workspace = special:claude, on-created-empty:exec [workspace special:claude silent] kitty --app-id=claude-sidebar --listen-on=unix:/tmp/kitty-fairy.sock -d /home/lican -e /home/lican/.config/hypr/custom/scripts/fairy-launch.sh
